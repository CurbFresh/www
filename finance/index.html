<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curb Fresh — Investor Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --kraft: #e3d3ac;
    --kraft-dark: #d3c093;
    --pine: #1f3d2b;
    --pine-light: #2f5940;
    --tomato: #c1440e;
    --cream: #fbf7ec;
    --ink: #2b2621;
    --gold: #c98a1f;
    --sage: #7a8b6f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,0.25), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(0,0,0,0.06), transparent 40%),
      var(--kraft);
    min-height:100vh;
    padding:32px 18px 60px;
  }
  .wrap{max-width:920px;margin:0 auto;}

  /* Header / crate stamp */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:18px;
    border-bottom:3px solid var(--ink);
    padding-bottom:20px;
    margin-bottom:28px;
  }
  .brand h1{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:44px;
    letter-spacing:1px;
    margin:0;
    color:var(--pine);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.08);
  }
  .brand p{
    margin:4px 0 0;
    font-size:13px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--ink);
    opacity:0.65;
    font-weight:600;
  }
  .stamp{
    border:3px dashed var(--tomato);
    color:var(--tomato);
    border-radius:50%;
    width:118px;height:118px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transform:rotate(-6deg);
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    flex-shrink:0;
    background:rgba(193,68,14,0.03);
  }
  .stamp .label{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;}
  .stamp .amount{
    font-family:'Anton', sans-serif;
    font-size:22px;
    line-height:1.1;
    margin:2px 0;
  }
  .stamp input{
    width:78px;
    text-align:center;
    border:none;
    background:transparent;
    font-family:'Anton', sans-serif;
    font-size:22px;
    color:var(--tomato);
  }
  .stamp input:focus{outline:none;border-bottom:1px solid var(--tomato);}

  /* Summary cards */
  .summary{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(160px,1fr));
    gap:14px;
    margin-bottom:32px;
  }
  .card{
    background:var(--cream);
    border:1px solid rgba(0,0,0,0.08);
    border-radius:6px;
    padding:16px 18px;
    box-shadow:0 2px 0 rgba(0,0,0,0.05);
  }
  .card .k{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    font-weight:600;
    color:var(--sage);
    margin-bottom:6px;
  }
  .card .v{
    font-family:'IBM Plex Mono', monospace;
    font-size:24px;
    font-weight:600;
    color:var(--pine);
  }
  .card.neg .v{color:var(--tomato);}

  /* Section titles */
  h2.section{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:20px;
    letter-spacing:0.5px;
    color:var(--pine);
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  h2.section::after{
    content:"";
    flex:1;
    height:2px;
    background:repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 12px);
    opacity:0.3;
  }

  /* Add entry form - receipt style */
  .receipt{
    background:var(--cream);
    border:1px solid rgba(0,0,0,0.08);
    border-radius:6px;
    padding:20px 22px 22px;
    margin-bottom:32px;
    box-shadow:0 2px 0 rgba(0,0,0,0.05);
  }
  .receipt form{
    display:grid;
    grid-template-columns:1fr 1fr 1fr auto;
    gap:12px;
    align-items:end;
  }
  .field label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:600;
    color:var(--sage);
    margin-bottom:5px;
  }
  .field input{
    width:100%;
    padding:9px 10px;
    border:1px solid rgba(0,0,0,0.18);
    border-radius:4px;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    background:#fff;
  }
  .field input:focus{outline:2px solid var(--pine-light); outline-offset:1px;}
  button{
    font-family:'Work Sans', sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.5px;
    cursor:pointer;
    border:none;
    border-radius:4px;
    transition:transform 0.1s ease, opacity 0.15s ease;
  }
  button:active{transform:scale(0.97);}
  .btn-add{
    background:var(--pine);
    color:var(--cream);
    padding:10px 20px;
    height:38px;
  }
  .btn-add:hover{background:var(--pine-light);}
  .btn-add:disabled{opacity:0.5;cursor:default;}
  .err{color:var(--tomato); font-size:12px; margin-top:8px; font-weight:600;}

  /* Chart */
  .chart-box{
    background:var(--pine);
    border-radius:8px;
    padding:22px 20px 10px;
    margin-bottom:32px;
    box-shadow:0 2px 0 rgba(0,0,0,0.15);
  }
  .chart-box h2.section{color:var(--cream);}
  .chart-box h2.section::after{background:repeating-linear-gradient(90deg, var(--cream) 0 6px, transparent 6px 12px); opacity:0.25;}
  .chart-empty{color:var(--cream); opacity:0.6; text-align:center; padding:40px 0; font-size:14px;}

  /* Ledger table */
  .ledger{
    background:var(--cream);
    border:1px solid rgba(0,0,0,0.08);
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 2px 0 rgba(0,0,0,0.05);
  }
  table{width:100%; border-collapse:collapse; font-family:'IBM Plex Mono', monospace; font-size:13.5px;}
  thead th{
    text-align:left;
    padding:12px 16px;
    font-family:'Work Sans', sans-serif;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--sage);
    font-weight:700;
    border-bottom:2px solid var(--ink);
  }
  tbody td{
    padding:11px 16px;
    border-bottom:1px dashed rgba(0,0,0,0.15);
  }
  tbody tr:last-child td{border-bottom:none;}
  td.num{text-align:right;}
  td.pos{color:var(--pine);}
  td.neg{color:var(--tomato);}
  .del-btn{
    background:transparent;
    color:var(--tomato);
    font-size:16px;
    padding:2px 8px;
    line-height:1;
  }
  .del-btn:hover{background:rgba(193,68,14,0.1);}
  .empty-row td{
    text-align:center;
    padding:28px;
    color:var(--sage);
    font-family:'Work Sans', sans-serif;
    font-style:italic;
  }
  .foot-note{
    text-align:center;
    font-size:11.5px;
    color:var(--ink);
    opacity:0.55;
    margin-top:18px;
    font-family:'Work Sans', sans-serif;
  }
  .reset-link{
    background:none;border:none;color:var(--tomato);text-decoration:underline;
    font-family:'Work Sans', sans-serif;font-size:11.5px;cursor:pointer;padding:0;margin-left:6px;
  }
  @media (max-width:640px){
    .receipt form{grid-template-columns:1fr 1fr;}
    .receipt form .field:nth-child(3){grid-column:1/3;}
    .receipt form button{grid-column:1/3;}
    .brand h1{font-size:34px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>CURB FRESH</h1>
      <p>Investor Financial Ledger</p>
    </div>
    <div class="stamp">
      <div class="label">Valuation</div>
      <div class="amount">$<input id="valuationInput" type="number" min="0" value="3000"></div>
      <div class="label">certified</div>
    </div>
  </header>

  <div class="summary" id="summaryCards"></div>

  <div class="receipt">
    <h2 class="section">Add Quarter</h2>
    <form id="entryForm">
      <div class="field">
        <label for="qLabel">Fiscal Quarter</label>
        <input id="qLabel" type="text" placeholder="Q3 2026" required>
      </div>
      <div class="field">
        <label for="qRevenue">Money Made ($)</label>
        <input id="qRevenue" type="number" step="0.01" placeholder="0.00" required>
      </div>
      <div class="field">
        <label for="qExpenses">Money Spent ($)</label>
        <input id="qExpenses" type="number" step="0.01" placeholder="0.00" required>
      </div>
      <button type="submit" class="btn-add" id="addBtn">Add to Ledger</button>
    </form>
    <div class="err" id="formErr" style="display:none;"></div>
  </div>

  <div class="chart-box">
    <h2 class="section">Revenue vs. Spend by Quarter</h2>
    <div id="chartWrap">
      <canvas id="ledgerChart" height="110"></canvas>
    </div>
    <div class="chart-empty" id="chartEmpty" style="display:none;">No entries yet — add a quarter above to see the chart.</div>
  </div>

  <div class="ledger">
    <table>
      <thead>
        <tr>
          <th>Fiscal Quarter</th>
          <th class="num">Money Made</th>
          <th class="num">Money Spent</th>
          <th class="num">Net Earnings</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="ledgerBody">
        <tr class="empty-row"><td colspan="5">Loading ledger…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="foot-note">
    Ledger data is shared and visible to anyone who opens this page.
    <button class="reset-link" id="resetBtn">Clear all data</button>
  </div>

</div>

<script>
const STORAGE_KEY = 'curbfresh:entries';
const VALUATION_KEY = 'curbfresh:valuation';
let entries = [];
let chart = null;

const fmt = (n) => {
  const neg = n < 0;
  const s = Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  return (neg ? '-$' : '$') + s;
};

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    entries = res ? JSON.parse(res.value) : [];
  }catch(e){
    entries = [];
  }
  try{
    const val = await window.storage.get(VALUATION_KEY, true);
    if(val){ document.getElementById('valuationInput').value = JSON.parse(val.value); }
  }catch(e){ /* keep default 3000 */ }
  render();
}

async function saveEntries(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(entries), true);
  }catch(e){
    showFormErr('Could not save — your entry may not persist.');
  }
}

async function saveValuation(v){
  try{
    await window.storage.set(VALUATION_KEY, JSON.stringify(v), true);
  }catch(e){ /* non-critical */ }
}

function showFormErr(msg){
  const el = document.getElementById('formErr');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(()=>{ el.style.display='none'; }, 3500);
}

function render(){
  renderSummary();
  renderTable();
  renderChart();
}

function renderSummary(){
  const totalRevenue = entries.reduce((s,e)=>s+e.revenue,0);
  const totalExpenses = entries.reduce((s,e)=>s+e.expenses,0);
  const net = totalRevenue - totalExpenses;
  const valuation = Number(document.getElementById('valuationInput').value) || 0;

  document.getElementById('summaryCards').innerHTML = `
    <div class="card"><div class="k">Total Money Made</div><div class="v">${fmt(totalRevenue)}</div></div>
    <div class="card"><div class="k">Total Money Spent</div><div class="v">${fmt(totalExpenses)}</div></div>
    <div class="card ${net<0?'neg':''}"><div class="k">Net Earnings</div><div class="v">${fmt(net)}</div></div>
    <div class="card"><div class="k">Current Valuation</div><div class="v">${fmt(valuation)}</div></div>
  `;
}

function renderTable(){
  const body = document.getElementById('ledgerBody');
  if(entries.length === 0){
    body.innerHTML = '<tr class="empty-row"><td colspan="5">No entries yet — add your first fiscal quarter above.</td></tr>';
    return;
  }
  body.innerHTML = entries.map((e,i)=>{
    const net = e.revenue - e.expenses;
    return `<tr>
      <td>${escapeHtml(e.label)}</td>
      <td class="num pos">${fmt(e.revenue)}</td>
      <td class="num neg">${fmt(e.expenses)}</td>
      <td class="num ${net<0?'neg':'pos'}">${fmt(net)}</td>
      <td class="num"><button class="del-btn" data-idx="${i}" title="Remove entry">✕</button></td>
    </tr>`;
  }).join('');

  body.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = Number(btn.dataset.idx);
      entries.splice(idx,1);
      await saveEntries();
      render();
    });
  });
}

function renderChart(){
  const canvas = document.getElementById('ledgerChart');
  const empty = document.getElementById('chartEmpty');
  if(entries.length === 0){
    canvas.style.display = 'none';
    empty.style.display = 'block';
    if(chart){ chart.destroy(); chart = null; }
    return;
  }
  canvas.style.display = 'block';
  empty.style.display = 'none';

  const labels = entries.map(e=>e.label);
  const revenue = entries.map(e=>e.revenue);
  const expenses = entries.map(e=>e.expenses);
  const net = entries.map(e=>e.revenue - e.expenses);

  if(chart){ chart.destroy(); }
  chart = new Chart(canvas, {
    data:{
      labels,
      datasets:[
        {
          type:'bar',
          label:'Money Made',
          data:revenue,
          backgroundColor:'#5c8f6f',
          borderRadius:3,
          order:2
        },
        {
          type:'bar',
          label:'Money Spent',
          data:expenses,
          backgroundColor:'#c1440e',
          borderRadius:3,
          order:2
        },
        {
          type:'line',
          label:'Net Earnings',
          data:net,
          borderColor:'#e0b04a',
          backgroundColor:'#e0b04a',
          borderWidth:2.5,
          pointRadius:4,
          pointBackgroundColor:'#e0b04a',
          tension:0.25,
          order:1
        }
      ]
    },
    options:{
      responsive:true,
      interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{
          labels:{color:'#fbf7ec', font:{family:"'Work Sans', sans-serif", size:12}}
        },
        tooltip:{
          callbacks:{
            label: (ctx) => `${ctx.dataset.label}: ${fmt(ctx.parsed.y)}`
          }
        }
      },
      scales:{
        x:{ ticks:{color:'#fbf7ec'}, grid:{color:'rgba(251,247,236,0.1)'} },
        y:{ ticks:{color:'#fbf7ec', callback:(v)=>fmt(v)}, grid:{color:'rgba(251,247,236,0.1)'} }
      }
    }
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('entryForm').addEventListener('submit', async (evt)=>{
  evt.preventDefault();
  const label = document.getElementById('qLabel').value.trim();
  const revenue = Number(document.getElementById('qRevenue').value);
  const expenses = Number(document.getElementById('qExpenses').value);

  if(!label){ showFormErr('Enter a fiscal quarter, e.g. "Q3 2026".'); return; }
  if(isNaN(revenue) || isNaN(expenses)){ showFormErr('Money made and money spent must be numbers.'); return; }

  const addBtn = document.getElementById('addBtn');
  addBtn.disabled = true;
  entries.push({label, revenue, expenses});
  await saveEntries();
  addBtn.disabled = false;
  evt.target.reset();
  render();
});

document.getElementById('valuationInput').addEventListener('change', async (evt)=>{
  const v = Number(evt.target.value) || 0;
  await saveValuation(v);
  renderSummary();
});

document.getElementById('resetBtn').addEventListener('click', async ()=>{
  if(!confirm('Clear all ledger entries? This cannot be undone.')) return;
  entries = [];
  await saveEntries();
  render();
});

loadData();
</script>
</body>
</html>
